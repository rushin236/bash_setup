# ~/.bashrc.d/global_source.conf
# Global desired versions for user-space environments.
# If left blank, the manager will install the latest stable/LTS version 
# and automatically write the exact version number back to this file.

VERSION_NODE="24.15.0"   # Known successful Node 24 LTS
VERSION_PYTHON="3.12.13" # Known successful Python 3.12
VERSION_JAVA="21.0.2"    # Known successful Java LTS
VERSION_RUBY="3.3.11"    # Known successful Ruby
VERSION_PHP="8.5.6"      # Known successful PHP
VERSION_GO="1.25.10"     # Known successful Go (Fixes lazygit)
VERSION_RUST="1.95.0"    # Known successful Rust
